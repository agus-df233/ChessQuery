[project]
name = "chessquery-etl"
version = "3.0.0"
description = "ETL de ratings (FIDE) para ChessQuery: S3 raw/staged + eventos rating.updated en SNS"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=chessquery_etl --cov-report=term-missing --cov-fail-under=90"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chessquery_etl"]
