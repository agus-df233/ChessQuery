spring:
  application:
    name: users
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chessquery}
    username: ${DB_USER:chessquery}
    password: ${DB_PASSWORD:chessquery}
  jpa:
    hibernate:
      ddl-auto: validate          # el esquema lo define Flyway; Hibernate solo verifica que coincida
    open-in-view: false
    properties:
      hibernate.default_schema: users
  flyway:
    schemas: users
    default-schema: users
    create-schemas: true
  cloud:
    aws:
      # Credenciales y endpoint: cadena por defecto del SDK. En la nube, el rol IAM de la task;
      # en local, AWS_ENDPOINT_URL=http://localhost:4566 + credenciales dummy (infra/.env.example).
      region:
        static: ${AWS_REGION:us-east-1}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Entra External ID: https://<tenant>.ciamlogin.com/<tenant-id>/v2.0
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}

chessquery:
  events:
    topic-arn: ${CHESS_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:chess-events}
    queues:
      elo: ${USERS_ELO_QUEUE:users-elo}
      rating: ${USERS_RATING_QUEUE:users-rating}
  identity:
    # Emisores cuyo email se considera verificado (adopción de perfiles del roster por email).
    trusted-email-issuers: ${OIDC_TRUSTED_EMAIL_ISSUERS:${OIDC_ISSUER_URI}}
  privacy:
    # Pepper del HMAC de RUT/FIDE/id federativo. En la nube viene de SSM y NUNCA se cambia sin
    # recalcular rut_hash y data_suppression (quedarían huérfanos). El default solo sirve en local.
    pepper: ${PRIVACY_PEPPER:dev-only-pepper-no-usar-en-cloud}
  auth:
    internal-token: ${INTERNAL_TOKEN:dev-internal-token}
    roles-claim: roles
  external-ratings:
    lichess-base-url: ${LICHESS_API_BASE:https://lichess.org}
    chesscom-base-url: ${CHESSCOM_API_BASE:https://api.chess.com}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
