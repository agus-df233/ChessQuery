<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1150 470" width="1150" height="470"><rect width="100%" height="100%" fill="white"/><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/></marker></defs>
<rect x="20" y="30" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="145.0" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">1 · Crear el club</text>
<text x="145.0" y="67" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">crear mi club = ser organizador</text>
<text x="145.0" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">plan y límites (torneos activos)</text>
<text x="145.0" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: users</text>
<line x1="270" y1="78" x2="302" y2="78" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="302" y="30" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="427.0" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">2 · Roster</text>
<text x="427.0" y="67" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">alta individual o CSV con vista previa</text>
<text x="427.0" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">etiquetas, bajas; provisorios</text>
<text x="427.0" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: users</text>
<line x1="552" y1="78" x2="584" y2="78" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="584" y="30" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="709.0" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">3 · Crear el torneo</text>
<text x="709.0" y="67" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">suizo o todos contra todos</text>
<text x="709.0" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">valida el plan del club en users</text>
<text x="709.0" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: tournament</text>
<line x1="834" y1="78" x2="866" y2="78" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="866" y="30" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="991.0" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">4 · Inscribir</text>
<text x="991.0" y="67" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">todo el roster o uno a uno;</text>
<text x="991.0" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">el jugador también se inscribe solo</text>
<text x="991.0" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: tournament</text>
<rect x="20" y="190" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="145.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">8 · Compartir</text>
<text x="145.0" y="227" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">vista pública /torneos/:id (QR)</text>
<text x="145.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">exportar TRF para homologar</text>
<text x="145.0" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: tournament</text>
<line x1="302" y1="238" x2="270" y2="238" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="302" y="190" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="427.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">7 · Cerrar el torneo</text>
<text x="427.0" y="227" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">tabla final + elo.updated</text>
<text x="427.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">por cada jugador</text>
<text x="427.0" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: tournament</text>
<line x1="584" y1="238" x2="552" y2="238" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="584" y="190" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="709.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">6 · Resultados por mesa</text>
<text x="709.0" y="227" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">1-0, ½-½, 0-1, no presentación;</text>
<text x="709.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">solo la ronda en curso</text>
<text x="709.0" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: tournament</text>
<line x1="866" y1="238" x2="834" y2="238" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="866" y="190" width="250" height="95" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="991.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">5 · Generar ronda</text>
<text x="991.0" y="227" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">pareo suizo sin revanchas,</text>
<text x="991.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">colores equilibrados y bye</text>
<text x="991.0" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">servicio: tournament</text>
<line x1="991" y1="125" x2="991" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<line x1="427" y1="285" x2="427" y2="345" stroke="#455a64" stroke-width="1.5" marker-end="url(#flecha)"/>
<rect x="378.75" y="305.0" width="96.5" height="15" rx="3" fill="white" fill-opacity="0.92"/>
<text x="427.0" y="316.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#455a64" text-anchor="middle">SNS → users-elo</text>
<rect x="282" y="345" width="290" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="427.0" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">users actualiza cada ficha</text>
<text x="427.0" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">rating de plataforma e historial</text>
<text x="427.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">(se ve en Jugadores y en Mi inicio)</text>
<rect x="640" y="345" width="490" height="80" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="1.6"/>
<text x="885.0" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00695c" text-anchor="middle">Calendario de la Federación (ETL)</text>
<text x="885.0" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">la Lambda diaria publica federation.tournament.published;</text>
<text x="885.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">tournament lo muestra en /torneos junto a los del club</text>
<rect x="20" y="345" width="240" height="80" rx="8" fill="#fffde7" stroke="#9e9d24" stroke-width="1.6"/>
<text x="140.0" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9e9d24" text-anchor="middle">Tabla con desempates</text>
<text x="140.0" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Buchholz, Buchholz corte 1,</text>
<text x="140.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Sonneborn-Berger, victorias</text>
