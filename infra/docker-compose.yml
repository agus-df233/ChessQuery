# Infra local de ChessQuery v3. No incluye los servicios Java: se corren desde Maven
# (mvn -pl services/users spring-boot:run) para iterar rápido. Ver `make local-up`.
name: chessquery

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chessquery
      POSTGRES_PASSWORD: chessquery
      POSTGRES_DB: chessquery
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessquery"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SNS + SQS + S3 locales (ADR-0002). Fijado en 4.14.0: desde las versiones 2026.x la imagen
  # exige LOCALSTACK_AUTH_TOKEN. La topología la crea infra/localstack/init/ready.d.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sns,sqs,s3
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name users-rating >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # UI

volumes:
  pgdata:
