# Infra local de ChessQuery v3. No incluye los servicios Java: se corren desde Maven
# (mvn -pl services/users spring-boot:run) para iterar rápido.
name: chessquery

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chessquery
      POSTGRES_PASSWORD: chessquery
      POSTGRES_DB: chessquery
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessquery"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: chessquery
      RABBITMQ_DEFAULT_PASS: chessquery
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:61613:61613"   # STOMP (relay del WebSocket de game)
      - "127.0.0.1:15672:15672"   # management UI
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chessquery
      MINIO_ROOT_PASSWORD: chessquery
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # UI

volumes:
  pgdata:
  miniodata:
