name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  java:
    name: Java services & libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Los tests de integración usan Testcontainers (PostgreSQL 16) con el Docker del runner.
      - name: Build & test (JaCoCo >= 90% por módulo)
        run: mvn -B -ntp verify

  web:
    name: Web (Vitest + axe + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests (incluye gates de accesibilidad axe-core y contraste AA)
        run: npm run test -w web
      - name: Typecheck + build de producción
        run: npm run build -w web

  security-scan:
    name: Trivy filesystem scan (bloqueante HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform (fmt + validate + trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.x"
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate (sin backend)
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/envs/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      # Informativo por ahora: el entorno Academy usa HTTP CloudFront→ALB y subnets públicas sin NAT
      # a propósito (costo; ver ADR-0002). Pasa a bloqueante con un .trivyignore justificado.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "0"
