name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  java:
    name: Java services & libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Los tests de integración usan Testcontainers (PostgreSQL 16) con el Docker del runner.
      - name: Build & test (JaCoCo >= 90% por módulo)
        run: mvn -B -ntp verify

  web:
    name: Web (Vitest + axe + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests (incluye gates de accesibilidad axe-core y contraste AA)
        run: npm run test -w web
      - name: Typecheck + build de producción
        run: npm run build -w web

  security-scan:
    name: Trivy filesystem scan (bloqueante HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
